version: 1

ci:
  image: docker.cr.pcfae.com/prplanit/stagefreight:latest-dev

git:
  branches:
    main: "^main$"
  tags:
    stable:     { pattern: "^v?\\d+\\.\\d+\\.\\d+$" }
    prerelease: { pattern: "^v?\\d+\\.\\d+\\.\\d+-.+" }
  versioning:
    branch_builds:
      default: { base_from: [stable], format: "{base}-dev+{sha}" }
    no_lineage:
      # No version tags yet: bootstrap dev builds from an explicit template (must
      # contain {sha}). Switch to `mode: error` once the first stable tag is cut.
      mode: explicit
      version: "0.1.0-dev+{sha}"

vars:
  org: prplanit
  github_org: PrPlanIT
  gitlab_group: PrPlanIT
  repo: istio-meshmedic
  github_repo: istio-meshmedic

builds:
  # meshmedic — Go CLI + node-agent DaemonSet, single scratch image from the repo's
  # own Dockerfile (multi-stage; Go binary, CGO disabled).
  meshmedic:
    kind: docker
    platforms: [linux/amd64]

forges:
  gitlab:
    provider: gitlab
    url: "https://gitlab.prplanit.com"
    credentials: GITLAB

  github:
    provider: github
    url: "https://github.com"
    credentials: GITHUB

repos:
  primary:
    forge: gitlab
    project: "{var:gitlab_group}/{var:repo}"
    roles: [primary]
    branches:
      default: main
    worktree: "."

  github-mirror:
    forge: github
    project: "{var:github_org}/{var:github_repo}"
    roles: [mirror, publish-origin]
    sync:
      git: true
      releases: true

registries:
  dockerhub:
    provider: docker
    url: docker.io
    credentials: DOCKER
    default_path: "{var:org}/{var:repo}"

  harbor:
    provider: harbor
    url: cr.pcfae.com
    credentials: HARBOR
    default_path: "{var:org}/{var:repo}"

publish:
  # ── Stable releases → all registries ──
  stable:
    kind: registry
    registry: [dockerhub, harbor]
    build: meshmedic
    tags: ["v{version}", "latest"]
    when: { git_tags: [stable], events: [tag] }

  # ── Pre-releases ──
  prerelease:
    kind: registry
    registry: [dockerhub, harbor]
    build: meshmedic
    tags: ["v{version}"]
    when: { git_tags: [prerelease], events: [tag] }

  # ── Dev builds on every commit → all registries (retained/pruned) ──
  dev:
    kind: registry
    registry: [dockerhub, harbor]
    build: meshmedic
    tags: ["dev-{sha:8}", "latest-dev"]
    when: { branches: [main], events: [push] }
    retention:
      keep_last: 6
      protect: ["latest-dev"]

  # ── Project metadata: registry overviews + forge repos ──
  project-metadata:
    kind: metadata
    registry: [dockerhub, harbor]
    repos: [primary, github-mirror]
    readme: README.md
    description:
      - "A Go CLI and node-agent DaemonSet that detects and heals Istio ambient-mesh enrollment orphans."
    topics: [istio, ambient-mesh, kubernetes, daemonset, go, service-mesh]
    when: { branches: [main], events: [push, tag] }

  # ── Release (gitlab primary; projects to github via github-mirror sync.releases) ──
  release:
    kind: release
    type: latest
    repos: [primary]
    aliases: ["v{version}", "latest"]
    when: { git_tags: [stable], events: [tag] }

build_cache:
  mode: hybrid
  external:
    registry: harbor
    path: "cache"
    fallback: "main"
  local:
    retention:
      max_age: "7d"
      max_size: "8GB"

commit:
  default_type: docs
  conventional: true
  backend: git

dependency:
  enabled: true
  output: ".stagefreight/deps"
  scope:
    go_modules: true
    dockerfile_env: true
  commit:
    enabled: true
    type: chore
    message: "update managed dependencies"
    push: true
    skip_ci: false

lint:
  level: full
  exclude:
    - "*.png"
    - "*.svg"
    - "*.ico"
  modules:
    freshness:
      enabled: true
      cache_ttl: 300
      sources:
        docker_images: true
        github_releases: true
        go_modules: true
      vulnerability:
        enabled: true
    tabs:
      enabled: true
    secrets:
      enabled: true
      exclude:
        - "go.sum"
    conflicts:
      enabled: true
    filesize:
      enabled: true
    unicode:
      enabled: true
      detect_bidi: true
      detect_zero_width: true
      detect_control_ascii: true

release:
  enabled: true
  security_summary: true
  registry_links: true

security:
  enabled: true
  output: ".stagefreight/security"
  sbom: true
  release_detail: full

toolchains:
  want:
    trivy: "0.69.3"
    syft: "1.42.3"
    grype: "0.110.0"
    osv-scanner: "2.3.5"
    cosign: "3.0.6"
  retention:
    keep_last: 2

# stencils: define each renderable once (id → stencil def). Inline defs render a
# badge (default) or a shield (render: shield); named producers render via type.
stencils:
  # ── generated badges ──
  build:          { label: build,      message: "{env:BUILD_STATUS}", color: auto, font: monofur, link: "https://gitlab.prplanit.com/{var:gitlab_group}/{var:repo}/-/pipelines" }
  license:        { label: license,    message: "AGPL-3.0-only", color: "#310937", font: monofur, link: LICENSE }
  release:        { label: release,    message: "v{base}", color: "#74ecbe", font: dejavu-sans, font_size: 11, link: "https://github.com/{var:github_org}/{var:github_repo}/releases" }
  updated:        { label: updated,    message: "{env:BUILD_DATE}", color: "#236144", font: dejavu-sans, font_size: 11 }
  pulls:          { label: pulls,      message: "{docker.pulls}", color: "#1d63ed", link: "https://hub.docker.com/r/{var:org}/{var:repo}" }

  # ── inline shields ──
  donate:  { render: shield, message: donate,  color: "#FF5E5B", logo: ko-fi,          logo_color: white, link: "https://ko-fi.com/T6T41IT163" }
  sponsor: { render: shield, message: sponsor, color: "#EA4AAA", logo: githubsponsors, logo_color: white, link: "https://github.com/sponsors/{var:github_org}" }
  github:  { render: shield, label: GitHub, message: source, color: "#181717", logo: github, link: "https://github.com/{var:github_org}/{var:github_repo}" }
  gitlab:  { render: shield, label: GitLab, message: source, color: "#FC6D26", logo: gitlab, link: "https://gitlab.prplanit.com/{var:gitlab_group}/{var:repo}" }
  docker:  { render: shield, label: Docker, message: "{var:org}/{var:repo}", color: "#2496ED", logo: docker, logo_color: white, link: "https://hub.docker.com/r/{var:org}/{var:repo}" }

  # ── named producers (repo resolves from repos: publish-origin) ──
  go-report:    { type: goreportcard }
  last-commit:  { type: github-last-commit }
  issues-open:  { type: github-issues-open }
  prs-open:     { type: github-prs-open }
  contributors: { type: github-contributors }

scribe:
  files:
    readme.badges:
      file: "README.md"
      between: ["<!-- sf:badges:start -->", "<!-- sf:badges:end -->"]
      inline: true
      items: [build, license, release, updated, donate, sponsor]

    readme.project:
      file: "README.md"
      between: ["<!-- sf:project:start -->", "<!-- sf:project:end -->"]
      inline: true
      items: [github, gitlab, go-report, last-commit, issues-open, prs-open, contributors]

    readme.image:
      file: "README.md"
      between: ["<!-- sf:image:start -->", "<!-- sf:image:end -->"]
      items: [docker, pulls]

  commit:
    type: docs
    message: "refresh generated docs and badges"
    add:
      - "README.md"
      - ".stagefreight/scribe"
    push: true
    skip_ci: true
